<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f3"><title>My Happy Home — Prototype 0.3</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#26372c;background:#f3f5ef}*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;min-height:100vh;background:white;padding:18px 17px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:8px 0 14px}p{color:#66746a;line-height:1.45;margin:5px 0 15px}.muted{font-size:12px;color:#738078}.pill{background:#e6eee4;border-radius:20px;padding:7px 11px;font-size:12px}.roof{height:100px;position:relative;overflow:hidden}.roof:before{content:'';position:absolute;width:215px;height:215px;transform:rotate(45deg);background:#e7f0e4;border:11px solid #79a384;border-radius:9px;left:50%;top:52px;margin-left:-108px}.house{border:4px solid #79a384;border-top:0;border-radius:0 0 12px 12px;padding:8px;background:#f8faf5}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{border:0;border-radius:12px;min-height:132px;padding:13px 6px;font:inherit;color:#2c4432;cursor:pointer}.tile b{display:block;margin:6px 0}.tile small{display:block;color:#617165}.emoji{font-size:29px}.green{background:#e3f0de}.yellow{background:#fff0d4}.blue{background:#e6edfb}.pink{background:#f8e7e3}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center}.link{border:0;background:none;color:#3e7750;font:inherit;cursor:pointer}.item{display:flex;align-items:center;gap:12px;border:1px solid #e1e6de;border-radius:12px;padding:14px;margin:9px 0;background:#fff;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}.item .grow{flex:1}.item small{display:block;color:#6b766e;margin-top:5px}.icon{font-size:25px}.btn{display:block;background:#487e56;color:white;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin:12px 0}.btn.alt{background:#e9f0e7;color:#335d3c}.back{background:none;border:0;color:#477451;font:inherit;padding:4px 0 20px;cursor:pointer}.field{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5cb;border-radius:10px;font:inherit;background:white}textarea{min-height:80px}.note{padding:12px;border-radius:12px;background:#f3f6ef;font-size:13px;color:#536257;margin:12px 0}.empty{padding:25px;text-align:center;color:#748078;border:1px dashed #cbd8cb;border-radius:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e6eae4;display:flex;justify-content:space-around;padding:10px}.nav button{border:0;background:none;font:inherit;font-size:12px;color:#526957;cursor:pointer}.nav span{display:block;font-size:20px}a.btn{text-align:center;text-decoration:none}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7db98d} .tag{font-size:11px;color:#69746b;background:#eef2eb;padding:4px 8px;border-radius:8px} .row{display:flex;gap:9px;align-items:center;justify-content:space-between}</style></head><body><main class="app"><header><div><strong>🏡 My Happy Home</strong><div class="muted">Know it. Maintain it. Fix it.</div></div><span class="pill">Prototype 0.3</span></header><div id="view"></div></main><nav class="nav"><button onclick="go('home')"><span>🏠</span>Home</button><button onclick="go('equipment')"><span>💡</span>Equipment</button><button onclick="go('calendar')"><span>🗓️</span>Calendar</button><button onclick="go('history')"><span>📋</span>History</button></nav><script>
const KEY='happyhome-v01';const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>iso(new Date());const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+Number(n));return iso(d)};const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const seed={assets:[{id:1,name:'Furnace',model:'Payne PG8MAA series',location:'Utility area'},{id:2,name:'Upstairs fireplace',model:'Montigo ME34-BV',location:'Upstairs'},{id:3,name:'Downstairs fireplace',model:'Montigo B34DR-2',location:'Downstairs'}],tasks:[{id:1,asset:1,name:'Inspect furnace filter',due:addDays(today(),2),days:90},{id:2,asset:2,name:'Review fireplace service needs',due:addDays(today(),9),days:365}],history:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch{db=seed}const save=()=>localStorage.setItem(KEY,JSON.stringify(db));let screen='home',selected=null;const el=document.getElementById('view');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const asset=id=>db.assets.find(a=>a.id==id);const task=id=>db.tasks.find(t=>t.id==id);function go(s,id){screen=s;selected=id;render();scrollTo(0,0)}function item(title,sub,fn,emoji='🔧'){return `<button class="item" onclick="${fn}"><span class="icon">${emoji}</span><span class="grow"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span>›</span></button>`}function render(){let out='';if(screen==='home'){const upcoming=db.tasks.filter(t=>!asset(t.asset)?.retired).sort((a,b)=>a.due.localeCompare(b.due));out=`<h1>Welcome home! ☀️</h1><p>What can we help you with today?</p><div class="roof"></div><div class="house"><div class="tiles"><button class="tile green" onclick="go('equipment')"><span class="emoji">💡</span><b>Know your home</b><small>Equipment & records</small></button><button class="tile yellow" onclick="go('calendar')"><span class="emoji">🗓️</span><b>Maintain it</b><small>Tasks & reminders</small></button><button class="tile blue" onclick="go('fix')"><span class="emoji">🔧</span><b>Fix what you can</b><small>Guided troubleshooting</small></button><button class="tile pink" onclick="go('help')"><span class="emoji">🤝</span><b>Get help</b><small>Advice & pros</small></button></div></div><section class="section"><div class="sectionhead"><h2>🗓️ Coming up</h2><button class="link" onclick="go('calendar')">View all ›</button></div>${upcoming.length?upcoming.slice(0,2).map(t=>item(t.name,(asset(t.asset)?.name||'Equipment')+' · '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join(''):'<div class="empty">All caught up! Add a maintenance task to get started.</div>'}</section>` }else if(screen==='equipment'){out=`<h1>💡 Know your home</h1><button class="btn" onclick="go('addAsset')">+ Add equipment</button><p>Keep your equipment and its history in one place.</p>${db.assets.filter(a=>!a.retired).map(a=>item(a.name,[a.brand,a.model].filter(Boolean).join(' '),`go('asset',${a.id})`,'🏠')).join('')}<h2>Retired equipment</h2>${db.assets.filter(a=>a.retired).map(a=>item(a.name,'History preserved',`go('asset',${a.id})`)).join('')||'<p>None</p>'}<button class="btn alt" onclick="exportData()">Export backup</button><label class="field">Restore backup (replaces current records)</label><input type="file" accept=".json,application/json" onchange="restoreData(this)">`}else if(screen==='addAsset'||screen==='editAsset'){const a=screen==='editAsset'?asset(selected):{};out=equipmentForm(a)}else if(screen==='asset'){const a=asset(selected);if(!a){go('equipment');return}out=`<button class="back" onclick="go('equipment')">← Equipment</button><h1>${esc(a.name)}</h1><p>${esc([a.brand,a.model,a.location].filter(Boolean).join(' · '))}</p><button class="btn alt" onclick="go('editAsset',${a.id})">✎ Edit equipment</button>${manualPanel(a)}<h2>Maintenance</h2>${a.retired?'<p>Retired — reminders paused.</p>':db.tasks.filter(t=>t.asset===a.id).map(t=>item(t.name,'Due '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join('')||'<p>No tasks yet.</p>'}${a.retired?'':`<button class="btn alt" onclick="go('addTask',${a.id})">+ Add maintenance task</button>`}<h2>Service history</h2>${db.history.filter(h=>h.asset===a.id).map(h=>`<div class="item"><div><b>${esc(h.name)}</b><small>${fmt(h.date)} · ${esc(h.notes||'Completed')}</small></div></div>`).join('')||'<p>No completed maintenance recorded yet.</p>'}<button class="btn alt" onclick="retireAsset(${a.id})">${a.retired?'Restore equipment':'Retire equipment (keep history)'}</button><button class="btn alt" style="color:#a33" onclick="removeAsset(${a.id})">Delete equipment</button>`}else if(screen==='calendar'){out=`<h1>🗓️ Maintain it</h1><p>Your maintenance schedule, organized by due date.</p>${db.tasks.filter(t=>!asset(t.asset)?.retired).sort((a,b)=>a.due.localeCompare(b.due)).map(t=>item(t.name,(asset(t.asset)?.name||'Equipment')+' · Due '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join('')||'<div class="empty">No tasks scheduled yet.</div>'}<button class="btn" onclick="go('addTask')">+ Add maintenance task</button><div class="note">Demo tasks and intervals are examples only. Manufacturer-specific recommendations require verification.</div>`}else if(screen==='addTask'){out=`<button class="back" onclick="go('calendar')">← Calendar</button><h1>Add maintenance task</h1><form onsubmit="addTask(event)"><label class="field">Equipment</label><select name="asset" required>${db.assets.filter(a=>!a.retired).map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}</select><label class="field">Task</label><input name="name" required placeholder="Inspect air filter"><label class="field">Next due date</label><input type="date" name="due" required value="${today()}"><label class="field">Repeat every (days)</label><input type="number" name="days" min="1" max="3650" value="90" required><div class="note">Choose an interval based on your own records or verified manufacturer guidance. The app does not validate it yet.</div><button class="btn">Create task</button></form>`}else if(screen==='task'){const t=task(selected);if(!t){go('calendar');return}out=`<button class="back" onclick="go('calendar')">← Calendar</button><h1>${esc(t.name)}</h1><p>${esc(asset(t.asset)?.name||'Equipment')} · Due ${fmt(t.due)}</p><div class="note">Repeats every ${t.days} days. ${t.source?`Reviewed manufacturer guidance, page ${t.sourcePage}. ${esc(t.detail)} <a href="${esc(safeURL(t.source))}" target="_blank" rel="noopener noreferrer">View source</a>`:'This is a user-defined or example interval, not verified manufacturer guidance.'}</div><form onsubmit="finishTask(event,${t.id})"><label class="field">What did you do? (optional)</label><textarea name="notes" placeholder="What did you check or replace?"></textarea><button class="btn">✓ Mark completed & record history</button></form><button class="btn alt" onclick="deleteTask(${t.id})">Delete this task</button>`}else if(screen==='history'){out=`<h1>📋 Maintenance history</h1><p>Completed work is automatically recorded here.</p>${db.history.map(h=>`<div class="item"><span class="icon">✅</span><div><b>${esc(h.name)}</b><small>${esc(asset(h.asset)?.name||'Equipment')} · ${fmt(h.date)}</small><small>${esc(h.notes||'Completed')}</small></div></div>`).join('')||'<div class="empty">No completed maintenance yet. Finish a task to create your first record.</div>'}`}else{out=`<button class="back" onclick="go('home')">← Home</button><h1>${screen==='fix'?'🔧 Fix what you can':'🤝 Get help'}</h1><p>${screen==='fix'?'Equipment-specific troubleshooting with verified guidance and real repair outcomes is planned for a future build.':'Professional referrals and assistance are planned for a future build.'}</p><div class="note">This section is not functional in Version 0.3.</div>`}el.innerHTML=out}function addTask(e){e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:Date.now(),asset:Number(f.get('asset')),name:f.get('name').trim(),due:f.get('due'),days:Number(f.get('days'))});save();go('calendar')}function finishTask(e,id){e.preventDefault();const t=task(id),f=new FormData(e.target);db.history.unshift({id:Date.now(),asset:t.asset,name:t.name,date:today(),notes:f.get('notes').trim(),source:t.source,sourcePage:t.sourcePage});t.due=addDays(today(),t.days);save();go('history')}function deleteTask(id){if(confirm('Delete this task? Completed history will be kept.')){db.tasks=db.tasks.filter(t=>t.id!==id);save();go('calendar')}}
const makers={bosch:'https://www.bosch-home.com/us/owner-support/owner-manuals',whirlpool:'https://www.whirlpool.com/services/manuals.html',ge:'https://www.geappliances.com/ge/service-and-support/literature.htm',lg:'https://www.lg.com/us/support/manuals-documents',samsung:'https://www.samsung.com/us/support/downloads/',maytag:'https://www.maytag.com/services/manuals.html',kitchenaid:'https://www.kitchenaid.com/service-and-support/manuals.html'};
function equipmentForm(a){return `<button class="back" onclick="go('equipment')">← Equipment</button><h1>${a.id?'Edit':'Add'} equipment</h1><form id="equipmentForm" onsubmit="storeAsset(event,${a.id||0})"><label class="field">Equipment name</label><input name="name" required value="${esc(a.name)}" placeholder="Dishwasher" oninput="labelHelp(this.value)"><div class="note" id="labelHelp">Look for the manufacturer's rating label. Never remove a powered or gas equipment panel to find it.</div><label class="field">📷 Take a label photo</label><input type="file" accept="image/*" capture="environment" onchange="readLabel(this)"><label class="field">Or choose an existing photo</label><input type="file" accept="image/*" onchange="readLabel(this)"><p id="ocrStatus" role="status" class="muted">Photo reading uses free browser OCR; internet required to load the reader. Confirm all extracted text.</p><img id="labelPreview" style="display:none;max-width:100%;max-height:220px;border-radius:10px" alt="Equipment label preview"><label class="field">Manufacturer</label><input name="brand" value="${esc(a.brand)}" placeholder="Bosch"><label class="field">Exact model / E-Nr</label><input name="model" value="${esc(a.model)}" placeholder="Include suffix after slash"><label class="field">Serial number (optional, stays on this device)</label><input name="serial" value="${esc(a.serial)}"><label class="field">Location</label><input name="location" value="${esc(a.location)}"><label class="field">Label text (review or copy model from here)</label><textarea name="labelText">${esc(a.labelText)}</textarea><label class="field">Manual link (optional)</label><input type="url" name="manual" value="${esc(a.manual)}" placeholder="https://..."><button class="btn">Save equipment & find manual</button></form>`}
function labelHelp(v){const n=v.toLowerCase();document.getElementById('labelHelp').textContent=n.includes('dishwasher')?'Open the door and look along the top or side edge. Bosch labels use E-Nr (include the slash suffix).':n.includes('refrigerator')?'Look inside the refrigerator compartment, along the side walls.':n.includes('water heater')?'Look for the rating label on the outside of the tank.':'Look for an accessible manufacturer rating label. Do not remove powered or gas equipment panels.'}
let ocrLoader;async function readLabel(input){const f=input.files[0],form=input.closest('form');if(!f)return;const status=form.querySelector('#ocrStatus'),img=form.querySelector('#labelPreview');if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);img.src=URL.createObjectURL(f);img.style.display='block';status.textContent='Loading label reader…';try{if(!window.Tesseract){ocrLoader=ocrLoader||new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>{ocrLoader=null;reject(Error('Could not load reader'))};document.head.appendChild(script)});await ocrLoader}const result=await Tesseract.recognize(f,'eng',{logger:m=>{status.textContent=m.status+(m.progress?' '+Math.round(m.progress*100)+'%':'')}});const text=result.data.text;form.elements.labelText.value=text;const model=text.match(/(?:E[- ]?Nr\.?|Model(?:\s*(?:No\.?|Number|#))?)\s*[:#]?\s*([A-Z0-9][A-Z0-9./-]{3,})/i);const serial=text.match(/(?:Serial(?:\s*(?:No\.?|Number|#))?|S\/N)\s*[:#]?\s*([A-Z0-9-]{4,})/i);if(model)form.elements.model.value=model[1];if(serial)form.elements.serial.value=serial[1];const brand=Object.keys(makers).find(b=>new RegExp('\\b'+b+'\\b','i').test(text));if(brand)form.elements.brand.value=brand[0].toUpperCase()+brand.slice(1);status.textContent='Review the extracted text and confirm the model before saving.'}catch(e){status.textContent='Could not read this photo. Try again or enter the label details manually.'}}
function safeURL(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function storeAsset(e,id){e.preventDefault();const f=new FormData(e.target),a=id?asset(id):{id:Date.now()};for(const k of ['name','brand','model','serial','location','labelText'])a[k]=String(f.get(k)||'').trim();a.manual=safeURL(f.get('manual'));if(!id)db.assets.push(a);save();go('asset',a.id)}
function manualPanel(a){return verifiedPanel(a)+fallbackManualPanel(a)}
function fallbackManualPanel(a){const brand=(a.brand||a.model||'').toLowerCase();const maker=Object.keys(makers).find(k=>brand===k||brand.startsWith(k+' '));const q=[a.brand,a.model,a.name,'official manufacturer owner manual'].filter(Boolean).join(' ');return `<h2>📚 Manufacturer manual</h2><div class="note">Manual search links are generated automatically. Exact model match and maintenance guidance are not verified by the app.</div>${maker?`<a class="btn alt" target="_blank" rel="noopener noreferrer" href="${esc(makers[maker])}">Official manufacturer lookup ↗</a>`:''}<a class="btn alt" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Search for my manual ↗</a>${safeURL(a.manual)?`<a class="btn alt" target="_blank" rel="noopener noreferrer" href="${esc(safeURL(a.manual))}">Open saved manual (user supplied) ↗</a>`:''}<button class="btn alt" onclick="go('editAsset',${a.id})">Save or change manual link</button>`}
function retireAsset(id){const a=asset(id);a.retired=!a.retired;save();go('asset',id)}function removeAsset(id){if(!confirm('Permanently delete this equipment, its tasks and service history? Export a backup first if needed.'))return;db.assets=db.assets.filter(a=>a.id!==id);db.tasks=db.tasks.filter(t=>t.asset!==id);db.history=db.history.filter(h=>h.asset!==id);save();go('equipment')}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='happy-home-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreData(input){try{const x=JSON.parse(await input.files[0].text());if(!['assets','tasks','history'].every(k=>Array.isArray(x[k])))throw Error();if(!x.assets.every(a=>Number.isSafeInteger(a.id)&&typeof a.name==='string')||!x.tasks.every(t=>Number.isSafeInteger(t.id)&&x.assets.some(a=>a.id===t.asset)&&typeof t.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&Number.isInteger(t.days)&&t.days>0)||!x.history.every(h=>Number.isSafeInteger(h.asset)&&typeof h.name==='string'&&typeof h.date==='string'))throw Error();if(confirm('Replace all current records with this backup?')){db=x;save();go('equipment')}}catch{alert('Invalid backup file. No records changed.')}input.value=''}
const verifiedCatalog=[{brand:'Montigo',model:'ME34-BV',url:'https://www.montigo.com/drive/uploads/2017/11/G0304-ME34-BV.pdf',page:10,task:'Arrange annual professional fireplace inspection',days:365,detail:'Annual inspection of the installation, including venting, burner and pilot. Arrange qualified service.'}];
function matchManual(a){const norm=x=>String(x||'').trim().toUpperCase();return verifiedCatalog.find(m=>(norm(a.brand)===norm(m.brand)&&norm(a.model)===norm(m.model))||(!a.brand&&norm(a.model)===norm(m.brand+' '+m.model)))}
function verifiedPanel(a){const m=matchManual(a);if(!m)return '<div class="note">No reviewed exact-model manual in our catalog yet. Use the manufacturer lookup below.</div>';const added=db.tasks.some(t=>t.asset===a.id&&t.source===m.url)||db.history.some(h=>h.asset===a.id&&h.source===m.url);return `<h2>📚 Reviewed model match</h2><div class="note">${esc(m.brand+' '+m.model)} · Confirm against your equipment label.</div><a class="btn alt" target="_blank" rel="noopener noreferrer" href="${esc(m.url)}#page=${m.page}">Open official manual (page ${m.page})</a><h2>Recommended maintenance</h2><div class="note"><b>${esc(m.task)}</b><p>${esc(m.detail)}</p>Manufacturer interval: yearly. Source: manual page ${m.page}.</div>${a.retired?'':added?'<p>Manufacturer task already recorded or scheduled.</p>':`<form onsubmit="addVerifiedTask(event,${a.id})"><label class="field">Choose first due date</label><input name="due" type="date" required value="${today()}"><label class="field"><input style="width:auto" type="checkbox" required> I confirmed the model on my equipment label.</label><button class="btn">Add recommended task</button></form>`}`}
function addVerifiedTask(e,id){e.preventDefault();const a=asset(id),m=a&&matchManual(a);if(!m||a.retired||db.tasks.some(t=>t.asset===id&&t.source===m.url))return;db.tasks.push({id:Date.now(),asset:id,name:m.task,due:new FormData(e.target).get('due'),days:m.days,source:m.url,sourcePage:m.page,detail:m.detail});save();go('asset',id)}
render();
</script></body></html>
