const KEY='happyhome-v01';const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>iso(new Date());const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+Number(n));return iso(d)};const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const seed={assets:[{id:1,name:'Furnace',model:'Payne PG8MAA series',location:'Utility area'},{id:2,name:'Upstairs fireplace',model:'Montigo ME34-BV',location:'Upstairs'},{id:3,name:'Downstairs fireplace',model:'Montigo B34DR-2',location:'Downstairs'}],tasks:[{id:1,asset:1,name:'Inspect furnace filter',due:addDays(today(),2),days:90},{id:2,asset:2,name:'Review fireplace service needs',due:addDays(today(),9),days:365}],history:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch{db=seed}let screen='home',selected=null;const el=document.getElementById('view');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const asset=id=>db.assets.find(a=>a.id==id);const task=id=>db.tasks.find(t=>t.id==id);function go(s,id){screen=s;selected=id;render();scrollTo(0,0)}function item(title,sub,fn,emoji='🔧'){return `<button class="item" onclick="${fn}"><span class="icon">${emoji}</span><span class="grow"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span>›</span></button>`}function render(){let out='';if(screen==='home'){const upcoming=db.tasks.filter(t=>!asset(t.asset)?.retired).sort((a,b)=>a.due.localeCompare(b.due));out=`<h1>Welcome home! ☀️</h1><p>What can we help you with today?</p><div class="roof"></div><div class="house"><div class="tiles"><button class="tile green" onclick="go('equipment')"><span class="emoji">💡</span><b>Know your home</b><small>Equipment & records</small></button><button class="tile yellow" onclick="go('calendar')"><span class="emoji">🗓️</span><b>Maintain it</b><small>Tasks & reminders</small>< inders paused.</p>':db.tasks.filter(t=>t.asset===a.id).map(t=>item(t.name,'Due '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join('')||'<p>No tasks yet.</p>'}${a.retired?'':`<button class="btn alt" onclick="go('addTask',${a.id})">+ Add maintenance task</button>`}<h2>Service history</h2>${db.history.filter(h=>h.asset===a.id).map(h=>`<div class="item"><div><b>${esc(h.name)}</b><small>${fmt(h.date)} · ${esc(h.notes||'Completed')}</small></div></div>`).join('')||'<p>No completed maintenance recorded yet.</p>'}<button class="btn alt" onclick="retireAsset(${a.id})">${a.retired?'Restore equipment':'Retire equipment (keep history)'}</button><button class="btn alt" style="color:#a33" onclick="removeAsset(${a.id})">Delete equipment</button>`}else if(screen==='calendar'){out=`<h1>🗓️ Maintain it</h1><p>Your maintenance schedule, organized by due date.</p>${db.tasks.filter(t=>!asset(t.asset)?.retired).sort((a,b)=>a.due.localeCompare(b.due)).map(t=>item(t.name,(asset(t.asset)?.name||'Equipment')+' · Due '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join('')||'<div class="empty">No tasks scheduled yet.</div>'}<button class="btn" onclick="go('addTask')">+ Add maintenance task</button><div class="note">Demo tasks and intervals are examples only. Manufacturer-specific recommendations require verification.</div>`}else if(screen==='addTask'){out=`<button class="back" onclick="go('calendar')">← Calendar</button><h1>Add maintenance task</h1><form onsubmit="addTask(event)"><label class="field">Equipment</label><select name="asset" required>${db.assets.filter(a=>!a.retired).map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}</select><label class="field">Task</label><input name="name" required placeholder="Inspect air filter"><label class="field">Next due date</label><input type="date" name="due" required value="${today()}"><label class="field">Repeat every (days)</label><input type="number" name="days" min="1" max="3650" value="90" required><div class="note">Choose an interval based on your own records or verified manufacturer guidance. The app does not validate it yet.</div><button class="btn">Create task</button></form>`}else if(screen==='task'){const t=task(selected);if(!t){go('calendar');return}out=`<button class="back" onclick="go('calendar')">← Calendar</button><h1>${esc(t.name)}</h1><p>${esc(asset(t.asset)?.name||'Equipment')} · Due ${fmt(t.due)}</p><div class="note">Repeats every ${t.days} days. ${t.source?`${t.sourceBasis?esc(t.sourceBasis):`Reviewed manufacturer guidance, page ${esc(t.sourcePage)}.`} ${esc(t.interval||'')} ${esc(t.who||'')} ${esc(t.detail)} <a href="${esc(safeURL(t.source))}" target="_blank" rel="noopener noreferrer">View source</a>`:'This is a user-defined or example interval, not verified manufacturer guidance.'}</div><form onsubmit="finishTask(event,${t.id})"><label class="field">What did you do? (optional)</label><textarea name="notes" placeholder="What did you check or replace?"></textarea><button class="btn">✓ Mark completed & record history</button></form><button class="btn alt" onclick="deleteTask(${t.id})">Delete this task</button>`}else if(screen==='history'){out=`<h1>📋 Maintenance history</h1><p>Completed work is automatically recorded here.</p>${db.history.map(h=>`<div class="item"><span class="icon">✅</span><div><b>${esc(h.name)}</b><small>${esc(asset(h.asset)?.name||'Equipment')} · ${fmt(h.date)}</small><small>${esc(h.notes||'Completed')}</small></div></div>`).join('')||'<div class="empty">No completed maintenance yet. Finish a task to create your first record.</div>'}`}else{out=`<button class="back" onclick="go('home')">← Home</button><h1>${screen==='fix'?'🔧 Fix what you can':'🤝 Get help'}</h1><p>${screen==='fix'?'Equipment-specific troubleshooting with verified guidance and real repair outcomes is planned for a future build.':'Professional referrals and assistance are planned for a future build.'}</p><div class="note">This section is not functional in Version 0.4.</div>`}el.innerHTML=out;el.querySelectorAll('[data-edit-asset]').forEach(button=>button.addEventListener('click',()=>{try{go('editAsset',button.dataset.editAsset)}catch(err){alert('Unable to open equipment editor: '+err.message)}}))}function addTask(e){e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:Date.now(),asset:Number(f.get('asset')),name:f.get('name').trim(),due:f.get('due'),days:Number(f.get('days'))});save();go('calendar')}function finishTask(e,id){e.preventDefault();const t=task(id),f=new FormData(e.target);db.history.unshift({id:Date.now(),asset:t.asset,name:t.name,date:today(),notes:f.get('notes').trim(),source:t.source,sourcePage:t.sourcePage,planKey:t.planKey,sourceBasis:t.sourceBasis});t.due=addDays(today(),t.days);save();go('history')}function deleteTask(id){if(confirm('Delete this task? Completed history will be kept.')){db.tasks=db.tasks.filter(t=>t.id!==id);save();go('calendar')}}
const makers={bosch:'https://www.bosch-home.com/us/owner-support/owner-manuals',whirlpool:'https://www.whirlpool.com/services/manuals.html',ge:'https://www.geappliances.com/ge/service-and-support/literature.htm',lg:'https://www.lg.com/us/support/manuals-documents',samsung:'https://www.samsung.com/us/support/downloads/',maytag:'https://www.maytag.com/services/manuals.html',kitchenaid:'https://www.kitchenaid.com/service-and-support/manuals.html'};
function equipmentForm(a){return `<button class="back" onclick="go('equipment')">← Equipment</button><h1>${a.id?'Edit':'Add'} equipment</h1><form id="equipmentForm" onsubmit="storeAsset(event,${a.id||0})"><div class="note" id="labelHelp">Look for the manufacturer's rating label. Never remove a powered or gas equipment panel to find it.</div><label class="field"><input type="checkbox" id="useAI" style="width:auto"> Use private AI scanner (authorized account only)</label><label class="field">📷 Take a label photo</label><input type="file" accept="image/*" capture="environment" onchange="scanLabel(this)"><label class="field">Or choose an existing photo</label><input type="file" accept="image/*" onchange="scanLabel(this)"><p id="ocrStatus" role="status" class="muted">Choose AI label reading (private test) or free browser OCR. AI sends the label photo to our secure scanner for processing. Review all suggestions.</p><img id="labelPreview" style="display:none;max-width:100%;max-height:220px;border-radius:10px" alt="Equipment label preview"><div id="scanReview" hidden></div><label class="field">Equipment name</label><input name="name" required value="${esc(a.name)}" placeholder="Dishwasher" oninput="labelHelp(this.value)"><label class="field">Manufacturer</label><input name="brand" value="${esc(a.brand)}" placeholder="Bosch"><label class="field">Exact model / E-Nr</label><input name="model" value="${esc(a.model)}" placeholder="Include suffix after slash"><label class="field">Serial number (optional; syncs when signed in)</label><input name="serial" value="${esc(a.serial)}"><label class="field">Manufacturing date (if printed)</label><input name="manufactured" value="${esc(a.manufactured)}"><label class="field">Electrical specifications (review)</label><input name="electrical" value="${esc(a.electrical)}"><label class="field">Location</label><input name="location" value="${esc(a.location)}"><details class="note"><summary>Original label information</summary><label class="field">Label transcription and scan notes</label><textarea name="labelText">${esc(a.labelText)}</textarea></details><label class="field">Manual link (optional)</label><input type="url" name="manual" value="${esc(a.manual)}" placeholder="https://..."><button type="submit" class="btn">Save equipment & find manual</button></form>`}
function labelHelp(v){const n=v.toLowerCase();document.getElementById('labelHelp').textContent=n.includes('dishwasher')?'Open the door and look along the top or side edge. Bosch labels use E-Nr (include the slash suffix).':n.includes('refrigerator')?'Look inside the refrigerator compartment, along the side walls.':n.includes('water heater')?'Look for the rating label on the outside of the tank.':'Look for an accessible manufacturer rating label. Do not remove powered or gas equipment panels.'}
const scanBrands=['Bosch','Whirlpool','KitchenAid','Maytag','Samsung','LG','GE Appliances','GE','Montigo','Payne','Carrier','Bryant','Rheem','Ruud','A. O. Smith','Bradford White','State','Kenmore','Frigidaire','Electrolux','Amana','Speed Queen','Trane','Lennox','Goodman','American Standard','Navien','Rinnai','Noritz','Miele','Fisher & Paykel','Hotpoint','Hot Spring','Jacuzzi','Sundance'];
function parseLabel(text){const t=text.replace(/\r/g,'').replace(/[–—]/g,'-');const get=(re)=>{const m=t.match(re);return m?m[1].trim():''};let model=get(/(?:\bE\s*[- ]?\s*Nr\.?|\bModel(?:\s*(?:No\.?|Number|#))?|\bMOD\.?|\bM\/N)\s*[:#]?\s*([A-Z0-9][A-Z0-9./-]{3,})/i);let serial=get(/(?:\bSerial(?:\s*(?:No\.?|Number|#))?|\bSER\.?|\bS\/N)\s*[:#]?\s*([A-Z0-9][A-Z0-9-]{3,})/i);const brands=scanBrands.filter(b=>!['GE','LG','State'].includes(b)&&new RegExp('(?:^|[^a-z0-9])'+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:$|[^a-z0-9])','i').test(t));const brand=brands.length===1?brands[0]:brands.length===2&&brands.includes('GE Appliances')&&brands.includes('GE')?'GE Appliances':'';if(brand==='Kenmore'&&!/\d/.test(model)){const m=t.match(/(?:^|\s)(\d{3})\.?(\d{8})(?=\s|$)/);if(m)model=m[1]+'.'+m[2]} if(brand==='Bosch'&&!/\d/.test(model)){model=get(/\b([A-Z]{3}\d{2}[A-Z]\d{2}[A-Z]{2}\/\d{2})\b/i)} const types=[['Dishwasher',/\bdishwasher\b/i],['Dryer',/\b(?:clothes dryer|tumble dryer|dryer)\b/i],['Washing machine',/\b(?:washing machine|clothes washer|washer)\b/i],['Refrigerator',/\b(?:refrigerator|refrigerator-freezer)\b/i],['Water heater',/\bwater heater\b/i],['Furnace',/\bfurnace\b/i],['Fireplace',/\b(?:fireplace|gas fireplace)\b/i],['Hot tub',/\b(?:hot tub|spa)\b/i]].filter(x=>x[1].test(t));return {brand,model:/\d/.test(model)?model:'',serial:/\d/.test(serial)?serial:'',name:types.length===1?types[0][0]:brand==='Bosch'&&/^SH[XPME]/i.test(model)?'Dishwasher':'',manufactured:get(/(?:manufactured(?:\s+(?:on|date))?|mfg\.?\s*date|date of manufacture)\s*[:#]?\s*((?:\d{1,2}[\/-])?\d{4}|\d{4}-\d{2}(?:-\d{2})?)/i),electrical:[...new Set(t.match(/\b\d{2,3}(?:\.\d+)?\s*(?:VAC|VOLTS?|V\b|HZ\b|AMPS?\b|A\b)/gi)||[])].join(', ')}}
function applyLabel(form,text){const parsed=parseLabel(text),filled=[];for(const [k,v] of Object.entries(parsed)){const field=form.elements[k];if(field&&v&&!field.value.trim()){field.value=v;filled.push(k)}}if(form.elements.name.value)labelHelp(form.elements.name.value);return filled}
const scanFieldNames={name:'Equipment name',brand:'Manufacturer',model:'Exact model',serial:'Serial number',manufactured:'Manufacturing date',electrical:'Electrical specifications',labelText:'Original label information'};
function reviewScan(form,values){
 const panel=form.querySelector('#scanReview');panel.replaceChildren();panel.hidden=true;
 const filled=[],conflicts=[];
 for(const [key,value] of Object.entries(values)){
  const field=form.elements[key];if(!field||typeof value!=='string'||!value.trim())continue;
  if(!field.value.trim()){field.value=value;filled.push(key);}
  else if(field.value.trim()!==value.trim())conflicts.push({key,value,original:field.value});
 }
 if(!conflicts.length)return {filled,conflicts};
 panel.hidden=false;panel.className='note';
 const heading=document.createElement('h2');heading.textContent='Review suggested corrections';panel.append(heading);
 const intro=document.createElement('p');intro.textContent='Choose the changes you want. Nothing is saved until you save the equipment.';panel.append(intro);
 const rows=[];
 for(const change of conflicts){
  const row=document.createElement('details');row.open=change.key!=='labelText';row.style.margin='12px 0';
  const title=document.createElement('summary');title.textContent=scanFieldNames[change.key]||change.key;row.append(title);
  for(const [label,value] of [['Current',change.original],['Suggested',change.value]]){const p=document.createElement('p');p.style.overflowWrap='anywhere';p.style.whiteSpace='pre-wrap';p.textContent=label+': '+value;row.append(p);}
  const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.style.width='auto';check.checked=change.key!=='name'&&change.key!=='labelText';label.append(check,document.createTextNode(' Use suggested value'));row.append(label);panel.append(row);rows.push({change,check});
 }
 const apply=document.createElement('button');apply.type='button';apply.className='btn';apply.textContent='Apply selected corrections';apply.onclick=()=>{
  let count=0,skipped=0;for(const {change,check} of rows){if(!check.checked)continue;const field=form.elements[change.key];if(field.value!==change.original){skipped++;continue;}field.value=change.value;count++;check.checked=false;check.disabled=true;}
  form.querySelector('#ocrStatus').textContent=count+' corrections applied. '+(skipped?skipped+' skipped because you edited them. ':'')+'Review and save equipment.';panel.hidden=true;
 };panel.append(apply);
 const keep=document.createElement('button');keep.type='button';keep.className='btn alt';keep.textContent='Keep existing values';keep.onclick=()=>{panel.hidden=true;form.querySelector('#ocrStatus').textContent='Existing values kept. Review and save equipment.';};panel.append(keep);
 return {filled,conflicts};
}
async function scanLabel(input){
 const form=input.closest('form'), file=input.files[0];

 if(!form.querySelector('#useAI').checked)return readLabel(input);
 const status=form.querySelector('#ocrStatus'),img=form.querySelector('#labelPreview'),saveButton=form.querySelector('button[type="submit"]');
 if(!user||!cloud){status.textContent='Sign in to use private AI scanning, or uncheck AI and select the photo again.';input.value='';return;}
 const uid=user.id;form.dataset.scanning='1';saveButton.disabled=true;
 try{
  if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);
  img.src=URL.createObjectURL(file);img.style.display='block';status.textContent='Preparing label photo...';await img.decode();
  const scale=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
  const image=c.toDataURL('image/jpeg',0.9);
  const {data:sessionData,error:sessionError}=await cloud.auth.getSession();

async function enterAccount(u){if(user?.id===u.id)return;user=u;ready=false;const cached=readLocal(accountKey());db=cached?.data||{assets:[],tasks:[],history:[]};base=cached?.base??null;dirty=!!cached?.dirty;controls();go('home');await syncCloud();}

if(dirty){if((row?.updated_at??null)!==base){status('Cloud conflict: local changes kept. Export a backup before choosing which copy to keep.');return}const snapshot=clone(db), stamp=new Date().toISOString();let q=row?cloud.from('home_records').update({data:snapshot,updated_at:stamp}).eq('user_id',uid).eq('updated_at',base):cloud.from('home_records').insert({user_id:uid,data:snapshot,updated_at:stamp});const result=await q.select('updated_at').single();if(result.error)throw result.error;if(user?.id!==uid)return;base=result.data.updated_at;dirty=JSON.stringify(snapshot)!==JSON.stringify(db);persist();status(dirty?'More local changes pending.':'Saved to cloud.');}
else if(row){if(base!==row.updated_at){db=clone(row.data);base=row.updated_at;persist();if(!['addAsset','editAsset','addTask','task'].includes(screen))go('home');}status('Cloud records up to date.');}else{status('No cloud records yet. Import device records or add equipment.');}
}catch(e){status('Cloud sync unavailable; local records retained. '+(e.message||''))}finally{busy=false}}
async function authenticate(e,signup){e.preventDefault();if(!cloud){status('Could not load account service.');return}const f=new FormData(e.target),credentials={email:String(f.get('email')).trim(),password:String(f.get('password'))};try{const r=signup?await cloud.auth.signUp({...credentials,options:{emailRedirectTo:'https://ryanstill9.github.io/my-happy-home/'}}):await cloud.auth.signInWithPassword(credentials);if(r.error)throw r.error;if(r.data.session)await enterAccount(r.data.session.user);else status('Check your email to confirm your account, then sign in.');}catch(err){status(err.message)}}
async function signOutCloud(){if(busy||dirty){status('Sync pending. Sync or export a backup before signing out.');return}const r=await cloud.auth.signOut();if(r.error){status(r.error.message);return}manualReadResults.clear();researchResults.clear();user=null;base=null;dirty=false;ready=false;db=readLocal(KEY)||clone(seed);controls();go('home');status('Local device mode.');}
function importDevice(){if(!user||busy||!ready||dirty||base!==null||db.assets.length||db.tasks.length||db.history.length){status('Import only into an empty, checked cloud account. Export both copies if you need to merge.');return}const local=readLocal(KEY);if(!local){status('No saved guest records found on this device.');return}if(confirm('Copy this device’s guest records into your empty cloud account?')){db=clone(local);save();go('home')}}
controls();if(cloud){cloud.auth.getSession().then(({data,error})=>{if(error)status(error.message);else if(data.session)enterAccount(data.session.user)});cloud.auth.onAuthStateChange((event,session)=>{if(session&&event==='SIGNED_IN')setTimeout(()=>enterAccount(session.user),0)});window.addEventListener('online',syncCloud);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncCloud()});setInterval(()=>{if(user&&dirty)syncCloud()},15000)}else status('Account service unavailable; local mode.');

</script></body></html>
