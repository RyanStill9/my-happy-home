<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f3"><title>My Happy Home — Prototype 0.1</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#26372c;background:#f3f5ef}*{box-sizing:border-box}body{margin:0}.app{max-width:480px;margin:auto;min-height:100vh;background:white;padding:18px 17px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:8px 0 14px}p{color:#66746a;line-height:1.45;margin:5px 0 15px}.muted{font-size:12px;color:#738078}.pill{background:#e6eee4;border-radius:20px;padding:7px 11px;font-size:12px}.roof{height:100px;position:relative;overflow:hidden}.roof:before{content:'';position:absolute;width:215px;height:215px;transform:rotate(45deg);background:#e7f0e4;border:11px solid #79a384;border-radius:9px;left:50%;top:52px;margin-left:-108px}.house{border:4px solid #79a384;border-top:0;border-radius:0 0 12px 12px;padding:8px;background:#f8faf5}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{border:0;border-radius:12px;min-height:132px;padding:13px 6px;font:inherit;color:#2c4432;cursor:pointer}.tile b{display:block;margin:6px 0}.tile small{display:block;color:#617165}.emoji{font-size:29px}.green{background:#e3f0de}.yellow{background:#fff0d4}.blue{background:#e6edfb}.pink{background:#f8e7e3}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center}.link{border:0;background:none;color:#3e7750;font:inherit;cursor:pointer}.item{display:flex;align-items:center;gap:12px;border:1px solid #e1e6de;border-radius:12px;padding:14px;margin:9px 0;background:#fff;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}.item .grow{flex:1}.item small{display:block;color:#6b766e;margin-top:5px}.icon{font-size:25px}.btn{display:block;background:#487e56;color:white;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin:12px 0}.btn.alt{background:#e9f0e7;color:#335d3c}.back{background:none;border:0;color:#477451;font:inherit;padding:4px 0 20px;cursor:pointer}.field{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5cb;border-radius:10px;font:inherit;background:white}textarea{min-height:80px}.note{padding:12px;border-radius:12px;background:#f3f6ef;font-size:13px;color:#536257;margin:12px 0}.empty{padding:25px;text-align:center;color:#748078;border:1px dashed #cbd8cb;border-radius:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e6eae4;display:flex;justify-content:space-around;padding:10px}.nav button{border:0;background:none;font:inherit;font-size:12px;color:#526957;cursor:pointer}.nav span{display:block;font-size:20px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7db98d} .tag{font-size:11px;color:#69746b;background:#eef2eb;padding:4px 8px;border-radius:8px} .row{display:flex;gap:9px;align-items:center;justify-content:space-between}</style></head><body><main class="app"><header><div><strong>🏡 My Happy Home</strong><div class="muted">Know it. Maintain it. Fix it.</div></div><span class="pill">Prototype 0.1</span></header><div id="view"></div></main><nav class="nav"><button onclick="go('home')"><span>🏠</span>Home</button><button onclick="go('equipment')"><span>💡</span>Equipment</button><button onclick="go('calendar')"><span>🗓️</span>Calendar</button><button onclick="go('history')"><span>📋</span>History</button></nav><script>
const KEY='happyhome-v01';const today=()=>new Date().toLocaleDateString('en-CA');const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+Number(n));return d.toLocaleDateString('en-CA')};const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const seed={assets:[{id:1,name:'Furnace',model:'Payne PG8MAA series',location:'Utility area'},{id:2,name:'Upstairs fireplace',model:'Montigo ME34-BV',location:'Upstairs'},{id:3,name:'Downstairs fireplace',model:'Montigo B34DR-2',location:'Downstairs'}],tasks:[{id:1,asset:1,name:'Inspect furnace filter',due:addDays(today(),2),days:90},{id:2,asset:2,name:'Review fireplace service needs',due:addDays(today(),9),days:365}],history:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch{db=seed}const save=()=>localStorage.setItem(KEY,JSON.stringify(db));let screen='home',selected=null;const el=document.getElementById('view');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const asset=id=>db.assets.find(a=>a.id==id);const task=id=>db.tasks.find(t=>t.id==id);function go(s,id){screen=s;selected=id;render();scrollTo(0,0)}function item(title,sub,fn,emoji='🔧'){return `<button class="item" onclick="${fn}"><span class="icon">${emoji}</span><span class="grow"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span>›</span></button>`}function render(){let out='';if(screen==='home'){const upcoming=[...db.tasks].sort((a,b)=>a.due.localeCompare(b.due));out=`<h1>Welcome home! ☀️</h1><p>What can we help you with today?</p><div class="roof"></div><div class="house"><div class="tiles"><button class="tile green" onclick="go('equipment')"><span class="emoji">💡</span><b>Know your home</b><small>Equipment & records</small></button><button class="tile yellow" onclick="go('calendar')"><span class="emoji">🗓️</span><b>Maintain it</b><small>Tasks & reminders</small></button><button class="tile blue" onclick="go('fix')"><span class="emoji">🔧</span><b>Fix what you can</b><small>Guided troubleshooting</small></button><button class="tile pink" onclick="go('help')"><span class="emoji">🤝</span><b>Get help</b><small>Advice & pros</small></button></div></div><section class="section"><div class="sectionhead"><h2>🗓️ Coming up</h2><button class="link" onclick="go('calendar')">View all ›</button></div>${upcoming.length?upcoming.slice(0,2).map(t=>item(t.name,(asset(t.asset)?.name||'Equipment')+' · '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join(''):'<div class="empty">All caught up! Add a maintenance task to get started.</div>'}</section>`}else if(screen==='equipment'){out=`<h1>💡 Know your home</h1><p>Keep your equipment and its history in one place.</p>${db.assets.map(a=>item(a.name,a.model,`go('asset',${a.id})`,'🏠')).join('')}<button class="btn" onclick="go('addAsset')">+ Add equipment</button>`}else if(screen==='addAsset'){out=`<button class="back" onclick="go('equipment')">← Equipment</button><h1>Add equipment</h1><form onsubmit="addAsset(event)"><label class="field">Equipment name</label><input name="name" required placeholder="Dishwasher"><label class="field">Brand and model (optional)</label><input name="model" placeholder="Brand / model number"><label class="field">Location (optional)</label><input name="location" placeholder="Kitchen"><button class="btn">Save equipment</button></form>`}else if(screen==='asset'){const a=asset(selected);if(!a){go('equipment');return}out=`<button class="back" onclick="go('equipment')">← Equipment</button><h1>${esc(a.name)}</h1><p>${esc(a.model)} · ${esc(a.location||'Location not set')}</p><div class="note">📚 Verified manufacturer manual lookup is not connected yet. No maintenance guidance here has been checked against a manual.</div><h2>Maintenance</h2>${db.tasks.filter(t=>t.asset===a.id).map(t=>item(t.name,'Due '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join('')||'<p>No tasks for this equipment yet.</p>'}<button class="btn alt" onclick="go('addTask',${a.id})">+ Add maintenance task</button><h2>Service history</h2>${db.history.filter(h=>h.asset===a.id).map(h=>`<div class="item"><div><b>${esc(h.name)}</b><small>${fmt(h.date)} · ${esc(h.notes||'Completed')}</small></div></div>`).join('')||'<p>No completed maintenance recorded yet.</p>'}<button class="btn alt" onclick="go('editAsset',${a.id})">Edit equipment</button>`}else if(screen==='editAsset'){const a=asset(selected);out=`<button class="back" onclick="go('asset',${a.id})">← Equipment details</button><h1>Edit equipment</h1><form onsubmit="editAsset(event,${a.id})"><label class="field">Name</label><input name="name" required value="${esc(a.name)}"><label class="field">Brand and model</label><input name="model" value="${esc(a.model)}"><label class="field">Location</label><input name="location" value="${esc(a.location)}"><button class="btn">Save changes</button></form>`}else if(screen==='calendar'){out=`<h1>🗓️ Maintain it</h1><p>Your maintenance schedule, organized by due date.</p>${[...db.tasks].sort((a,b)=>a.due.localeCompare(b.due)).map(t=>item(t.name,(asset(t.asset)?.name||'Equipment')+' · Due '+fmt(t.due),`go('task',${t.id})`,'🗓️')).join('')||'<div class="empty">No tasks scheduled yet.</div>'}<button class="btn" onclick="go('addTask')">+ Add maintenance task</button><div class="note">Demo tasks and intervals are examples only. Manufacturer-specific recommendations require verification.</div>`}else if(screen==='addTask'){out=`<button class="back" onclick="go('calendar')">← Calendar</button><h1>Add maintenance task</h1><form onsubmit="addTask(event)"><label class="field">Equipment</label><select name="asset" required>${db.assets.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}</select><label class="field">Task</label><input name="name" required placeholder="Inspect air filter"><label class="field">Next due date</label><input type="date" name="due" required value="${today()}"><label class="field">Repeat every (days)</label><input type="number" name="days" min="1" max="3650" value="90" required><div class="note">Choose an interval based on your own records or verified manufacturer guidance. The app does not validate it yet.</div><button class="btn">Create task</button></form>`}else if(screen==='task'){const t=task(selected);if(!t){go('calendar');return}out=`<button class="back" onclick="go('calendar')">← Calendar</button><h1>${esc(t.name)}</h1><p>${esc(asset(t.asset)?.name||'Equipment')} · Due ${fmt(t.due)}</p><div class="note">Repeats every ${t.days} days. This is a user-defined or example interval, not verified manufacturer guidance.</div><form onsubmit="finishTask(event,${t.id})"><label class="field">What did you do? (optional)</label><textarea name="notes" placeholder="What did you check or replace?"></textarea><button class="btn">✓ Mark completed & record history</button></form><button class="btn alt" onclick="deleteTask(${t.id})">Delete this task</button>`}else if(screen==='history'){out=`<h1>📋 Maintenance history</h1><p>Completed work is automatically recorded here.</p>${db.history.map(h=>`<div class="item"><span class="icon">✅</span><div><b>${esc(h.name)}</b><small>${esc(asset(h.asset)?.name||'Equipment')} · ${fmt(h.date)}</small><small>${esc(h.notes||'Completed')}</small></div></div>`).join('')||'<div class="empty">No completed maintenance yet. Finish a task to create your first record.</div>'}`}else{out=`<button class="back" onclick="go('home')">← Home</button><h1>${screen==='fix'?'🔧 Fix what you can':'🤝 Get help'}</h1><p>${screen==='fix'?'Equipment-specific troubleshooting with verified guidance and real repair outcomes is planned for a future build.':'Professional referrals and assistance are planned for a future build.'}</p><div class="note">This section is not functional in Version 0.1.</div>`}el.innerHTML=out}function addAsset(e){e.preventDefault();const f=new FormData(e.target),id=Date.now();db.assets.push({id,name:f.get('name').trim(),model:f.get('model').trim()||'Model not entered',location:f.get('location').trim()});save();go('asset',id)}function editAsset(e,id){e.preventDefault();const f=new FormData(e.target),a=asset(id);a.name=f.get('name').trim();a.model=f.get('model').trim();a.location=f.get('location').trim();save();go('asset',id)}function addTask(e){e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:Date.now(),asset:Number(f.get('asset')),name:f.get('name').trim(),due:f.get('due'),days:Number(f.get('days'))});save();go('calendar')}function finishTask(e,id){e.preventDefault();const t=task(id),f=new FormData(e.target);db.history.unshift({id:Date.now(),asset:t.asset,name:t.name,date:today(),notes:f.get('notes').trim()});t.due=addDays(today(),t.days);save();go('history')}function deleteTask(id){if(confirm('Delete this task? Completed history will be kept.')){db.tasks=db.tasks.filter(t=>t.id!==id);save();go('calendar')}}render();
</script></body></html>
